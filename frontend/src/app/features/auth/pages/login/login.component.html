<main class="space-y-6">
  <div class="space-y-2">
    <h1 class="text-2xl font-semibold tracking-tight text-white">
      Bem vindo de volta
    </h1>
    <p class="text-sm text-slate-300">
      Insira seu email e senha para acessar sua conta
    </p>
  </div>

  <form
    [formGroup]="loginForm"
    class="flex flex-col gap-2"
    (submit)="handleSubmit()"
    ngNativeValidate
  >
    <div class="flex flex-col gap-1">
      <input
        pInputText
        required
        type="email"
        name="email"
        formControlName="email"
        placeholder="Email"
        class="p-inputtext-sm hover:!border-emerald-500 focus-within:!border-emerald-500"
      />
    </div>

    <div class="flex flex-col gap-1">
      <input
        pInputText
        required
        name="password"
        type="password"
        formControlName="password"
        placeholder="Senha"
        class="p-inputtext-sm hover:!border-emerald-500 focus-within:!border-emerald-500"
      />
    </div>

    <button
      pButton
      pRipple
      type="submit"
      [disabled]="isSubmitting"
      size="small"
      label="Entrar"
      class="!bg-blue-800 hover:!bg-emerald-600 !border-emerald-500 hover:!border-emerald-600"
    ></button>
  </form>

  <div class="flex flex-col">
    <p class="text-sm text-slate-300">
      Ainda não tem uma conta?
      <a
        routerLink="/auth/register"
        class="font-medium underline hover:text-slate-200"
        >Criar</a
      >
    </p>
  </div>
</main>
