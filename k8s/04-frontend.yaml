apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifit-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unifit-frontend
  template:
    metadata:
      labels:
        app: unifit-frontend
    spec:
      containers:
        - name: frontend
          image: unifit-frontend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: unifit-frontend
spec:
  type: NodePort
  selector:
    app: unifit-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
