apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifit-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unifit-backend
  template:
    metadata:
      labels:
        app: unifit-backend
    spec:
      containers:
        - name: backend
          image: unifit-backend:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: unifit-config }
            - secretRef: { name: unifit-secret }
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: unifit-backend
spec:
  selector:
    app: unifit-backend
  ports:
    - port: 8080
      targetPort: 8080
